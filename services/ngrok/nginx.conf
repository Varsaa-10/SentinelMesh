# =============================================================================
# nginx Reverse Proxy — Routes all SentinelMesh services through a single port
# =============================================================================
# Used with ngrok free tier to expose all services via one tunnel.
#
# URL Mapping:
#   /                -> Webapp         (port 5000)
#   /auth/           -> AuthService    (port 5001)
#   /dashboard/      -> Grafana        (port 3000)
#   /pgadmin/        -> PostgreSQL     (port 5432 — info page only)
#   /logs/           -> Log Collector  (port 24224 — info page only)
# =============================================================================

upstream webapp {
    server webapp:5000;
}

upstream authservice {
    server authservice:5001;
}

upstream dashboard {
    server dashboard:3000;
}

server {
    listen 8080;
    server_name _;

    # --- Webapp (default route) ---
    location / {
        proxy_pass http://webapp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- AuthService ---
    location /auth/ {
        proxy_pass http://authservice/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Grafana Dashboard ---
    location /dashboard/ {
        proxy_pass http://dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana sub-resources (API, assets, websocket)
    location /dashboard/api/ {
        proxy_pass http://dashboard/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dashboard/public/ {
        proxy_pass http://dashboard/public/;
    }

    # --- Health check for nginx itself ---
    location /nginx-health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # --- Info pages for non-HTTP services ---
    location /pgadmin {
        return 200 '{"service":"PostgreSQL","host":"database","port":5432,"note":"Use a database client to connect via the main ngrok TCP tunnel or directly."}';
        add_header Content-Type application/json;
    }

    location /logs {
        return 200 '{"service":"Log Collector (Fluentd)","host":"logcollector","port":24224,"note":"TCP-based service. Use Fluentd client or forward driver to connect."}';
        add_header Content-Type application/json;
    }
}
