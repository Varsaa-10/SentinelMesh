# =============================================================================
# ngrok Configuration — Single tunnel through nginx reverse proxy
# =============================================================================
# All services are accessed through one tunnel via path-based routing:
#   /                -> Webapp
#   /auth/           -> AuthService
#   /dashboard/      -> Grafana Dashboard
# =============================================================================

version: 3

tunnels:
  sentinelmesh:
    proto: http
    addr: proxy:8080
    metadata: "SentinelMesh — All Services (via nginx proxy)"
