# SentinelMesh Log Collector — Fluentd Configuration
# Accepts forward protocol input and writes to local file output

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match **>
  @type file
  path /var/log/sentinelmesh/app
  append true
  <format>
    @type json
  </format>
  <buffer>
    flush_mode interval
    flush_interval 5s
  </buffer>
</match>
