# Scenario 6 — Log Tampering (S6, CWE-732)
# World-writable (777) permissions on /var/log/sentinelmesh/ in logcollector.

- rule: SentinelMesh Log Directory Tampering
  desc: >
    Write to the SentinelMesh log directory, which is world-writable due to
    S6. Legitimate log writes come from the logcollector's own Fluentd
    process — this rule should exclude that expected writer once confirmed.
  condition: >
    evt.type in (open, openat, openat2) and
    evt.is_open_write = true and
    container.name = "sentinelmesh-logcollector" and
    fd.name startswith "/var/log/sentinelmesh/"
  output: >
    Write to SentinelMesh log directory (file=%fd.name process=%proc.name
    user=%user.name container=%container.name)
  priority: WARNING
  tags: [sentinelmesh, s6, log-tampering, filesystem]
