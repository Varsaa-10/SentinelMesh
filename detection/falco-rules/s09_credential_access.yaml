# Scenario 9 — Credential Access (post-exploitation)
# RENUMBERED 2026-08-17: this was originally S7, but conflicted with
# Person 1's changelog, which defines S7 as the Grafana dashboard
# default-creds/anonymous-access vulnerability. Moved to S9 to free up
# S7 for its correct vulnerability. The chain scenario (previously S9)
# is renumbered to S10 accordingly — see s10_full_chain reference in
# ground_truth.json.
#
# Reads /etc/shadow, SSH private key, or AWS credentials after a foothold.
# Explicitly excludes /etc/passwd (read by legitimate processes/health checks).

- rule: SentinelMesh Sensitive Credential File Read
  desc: >
    Read access to a sensitive credential file inside a SentinelMesh
    application container, following an established foothold (Scenario 9,
    or a stage of the Scenario 10 chain).
  condition: >
    evt.type in (open, openat, openat2) and
    evt.is_open_read = true and
    container.name startswith "sentinelmesh-" and
    (fd.name = "/etc/shadow" or
     fd.name glob "/root/.ssh/*" or
     fd.name = "/root/.aws/credentials")
  output: >
    Sensitive credential file read (file=%fd.name process=%proc.name
    parent=%proc.pname container=%container.name)
  priority: CRITICAL
  tags: [sentinelmesh, s9-postexploit, credential-access, filesystem]
